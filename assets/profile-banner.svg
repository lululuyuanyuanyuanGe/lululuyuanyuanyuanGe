<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Luyuan Ge - Artificial Intelligence Systems and Infrastructure</title>
  <desc id="desc">A dark technical banner connecting agent state, runtime control, cache memory, and GPU serving.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.56" stop-color="#0b1d33"/>
      <stop offset="1" stop-color="#102a46"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39c6ff"/>
      <stop offset="1" stop-color="#6ee7c7"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#9ec9ec" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <circle cx="1050" cy="70" r="180" fill="#2f8cff" opacity="0.08"/>
  <circle cx="1120" cy="330" r="210" fill="#45e0c0" opacity="0.06"/>

  <g transform="translate(70 62)">
    <text x="0" y="0" fill="#8fb2d1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="650" letter-spacing="4">LUYUAN GE / 戈麓源</text>
    <text x="0" y="72" fill="#f4f9ff" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="46" font-weight="760" letter-spacing="0.5">INFERENCE SYSTEMS / INFRASTRUCTURE</text>
    <rect x="0" y="97" width="650" height="4" rx="2" fill="url(#accent)" filter="url(#glow)"/>
    <text x="0" y="137" fill="#b9cee2" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16">Artificial Intelligence (AI) inference · Key-Value cache · Distributed systems · Real-time serving</text>
  </g>

  <g transform="translate(70 260)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <g>
      <rect x="0" y="0" width="190" height="54" rx="12" fill="#102a44" stroke="#2d658c"/>
      <circle cx="24" cy="27" r="6" fill="#39c6ff"/>
      <text x="42" y="34" fill="#e4f4ff" font-size="16" font-weight="650">AGENT STATE</text>
    </g>
    <path d="M 205 27 H 245" stroke="#4f8db6" stroke-width="2"/>
    <path d="M 239 21 L 247 27 L 239 33" fill="none" stroke="#4f8db6" stroke-width="2"/>
    <g transform="translate(260 0)">
      <rect x="0" y="0" width="210" height="54" rx="12" fill="#102a44" stroke="#2d658c"/>
      <circle cx="24" cy="27" r="6" fill="#49d4e8"/>
      <text x="42" y="34" fill="#e4f4ff" font-size="16" font-weight="650">RUNTIME CONTROL</text>
    </g>
    <path d="M 485 27 H 525" stroke="#4f8db6" stroke-width="2"/>
    <path d="M 519 21 L 527 27 L 519 33" fill="none" stroke="#4f8db6" stroke-width="2"/>
    <g transform="translate(540 0)">
      <rect x="0" y="0" width="205" height="54" rx="12" fill="#102a44" stroke="#2d658c"/>
      <circle cx="24" cy="27" r="6" fill="#5adfda"/>
      <text x="42" y="34" fill="#e4f4ff" font-size="16" font-weight="650">KEY-VALUE / MEMORY</text>
    </g>
    <path d="M 760 27 H 800" stroke="#4f8db6" stroke-width="2"/>
    <path d="M 794 21 L 802 27 L 794 33" fill="none" stroke="#4f8db6" stroke-width="2"/>
    <g transform="translate(815 0)">
      <rect x="0" y="0" width="205" height="54" rx="12" fill="#102a44" stroke="#2d658c"/>
      <circle cx="24" cy="27" r="6" fill="#6ee7c7"/>
      <text x="42" y="34" fill="#e4f4ff" font-size="16" font-weight="650">MODEL SERVING</text>
    </g>
  </g>
</svg>
